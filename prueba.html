<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXUS | Smart Campus</title>

    <!-- Bootstrap -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <!-- Nuestro CSS -->
    <link rel="stylesheet" href="css/style.css">
        <!-- Script de model-viewer obligatorio en el head para componentes web -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        model-viewer {
            width: 100%;
            height: 450px;
            background-color: #111827; /* Un fondo oscuro elegante para que resalte el campus */
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<body>

    <main class="hero">

        <div class="container text-center">

            <p class="subtitle">
                SMART CAMPUS EXPERIENCE
            </p>

            <h1>
                NEXUS
            </h1>

            <p class="description">
                Conectando tecnología, personas y futuro.
            </p>

           
<div class="buttons">
    <button class="btn btn-primary" onclick="mostrarCampus()">
        EXPLORAR CAMPUS
    </button>

    <a href="dashboard.html" class="btn btn-primary">
        VER DASHBOARD
    </a>
</div>

             <div class="row justify-content-center">
                <div class="col-lg-10">
                    <model-viewer src="./blender/nexus_campus.glb" alt="NEXUS Campus" auto-rotate camera-controls loading="eager"></model-viewer>
                </div>
            </div>

        </div>

    </main>
    
<section id="campus-page" class="campus-page" hidden>
    <button class="btn btn-primary" onclick="ocultarCampus()">
        VOLVER AL INICIO
    </button>

    <h2>Campus NEXUS 3D</h2>

    <model-viewer
        src="./blender/nexus_campus.glb"
        alt="Modelo 3D del campus NEXUS"
        camera-controls
        auto-rotate
        shadow-intensity="1">
    </model-viewer>
</section>

<script>
function mostrarCampus() {
    document.querySelector("main").hidden = true;
    document.getElementById("campus-page").hidden = false;
}

function ocultarCampus() {
    document.getElementById("campus-page").hidden = true;
    document.querySelector("main").hidden = false;
}
</script>

 </body>

</html>
